[package]
name = "quickfind"
version = "0.2.0"
description = "A fast file search tool for Windows"
authors = ["QuickFind Team"]
edition = "2021"

[lib]
name = "quickfind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# File indexing
walkdir = "2"
notify = "6"
jwalk = "0.8"

# Search
fuzzy-matcher = "0.3"
regex = "1"
aho-corasick = "1"

# Concurrency
parking_lot = "0.12"
rayon = "1"
tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
dirs = "5"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }

# Pinyin search (Chinese)
pinyin = "0.10"

# Content search
grep = "0.3"
grep-matcher = "0.1"
grep-searcher = "0.1"
grep-regex = "0.1"

# File preview
syntect = "5"
mime_guess = "2"
infer = "0.15"
image = "0.25"

# Safe file operations
trash = "5"

# Windows-specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "fileapi", "winbase", "winnt", "handleapi", "errhandlingapi",
    "namedpipeapi", "winuser", "processthreadsapi", "synchapi"
] }
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader"
] }

[features]
default = []
everything = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true